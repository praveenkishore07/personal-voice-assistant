name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Vosk English model
        run: |
          mkdir -p app/src/main/assets/model-en-us
          curl -fL -o vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-en-us-0.15/* app/src/main/assets/model-en-us/
          uuidgen > app/src/main/assets/model-en-us/uuid
          rm -rf vosk-model.zip /tmp/vosk
          ls -la app/src/main/assets/model-en-us

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Download APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0 --yes || true
          gh release create v2.0 app/build/outputs/apk/debug/app-debug.apk --target main --title "Personal Assistant v2.0" --notes "Offline Voice Assistant APK"
